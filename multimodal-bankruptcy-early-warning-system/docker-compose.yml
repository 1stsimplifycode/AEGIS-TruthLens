services:
  api:
    build: .
    container_name: multimodal_bankruptcy_early_warning_system_api
    env_file: .env.example
    ports:
      - "8000:8000"
    depends_on: [postgres, redis, mongo]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: multimodal_bankruptcy_early_warning_system
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
volumes:
  pgdata:
